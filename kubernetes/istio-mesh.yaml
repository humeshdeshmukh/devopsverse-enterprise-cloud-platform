apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: devopsverse-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.devopsverse.local"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: payment-virtual-service
  namespace: default
spec:
  hosts:
    - payment-api.devopsverse.local
  gateways:
    - devopsverse-gateway
  http:
    - route:
        - destination:
            host: payment-api
            subset: v1
          weight: 90
        - destination:
            host: payment-api
            subset: v2-canary
          weight: 10
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payment-destination-rule
  namespace: default
spec:
  host: payment-api
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # Strict mTLS
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2-canary
      labels:
        version: v2
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mtls
  namespace: default
spec:
  mtls:
    mode: STRICT
